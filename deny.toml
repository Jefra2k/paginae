# cargo-deny configuration: only permissive licences are allowed (see docs/THIRD-PARTY.md).
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
]

[bans]
multiple-versions = "allow"

[advisories]
ignore = []
